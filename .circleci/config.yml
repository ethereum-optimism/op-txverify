version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.26.6
    resource_class: medium+
    environment:
      GOFLAGS: -mod=readonly
  # The plain cimg/go image ships no Node, which the page and wasm tests need.
  go-node-executor:
    docker:
      - image: cimg/go:1.26.6-node
    resource_class: medium+
    environment:
      GOFLAGS: -mod=readonly

commands:
  github-checkout:
    description: "Check out the repo over HTTPS. Uses a read-only GitHub App installation token when GITHUB_CHECKOUT_APP_ID and GITHUB_CHECKOUT_APP_PRIVATE_KEY_B64 are set, otherwise clones anonymously."
    parameters:
      method:
        description: "Clone method: full or blobless (blob:none filter)."
        type: enum
        enum: ["full", "blobless"]
        default: "full"
    steps:
      - run:
          name: Check out code
          environment:
            CHECKOUT_METHOD: << parameters.method >>
          command: |
            set -euo pipefail

            : "${CIRCLE_SHA1:?CIRCLE_SHA1 is not set}"

            repo_url="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            repo_path="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            token=""
            basic=""

            have_tools() {
              for tool in openssl curl jq; do
                command -v "$tool" >/dev/null 2>&1 || return 1
              done
            }

            if [ -n "${GITHUB_CHECKOUT_APP_ID:-}" ] && [ -n "${GITHUB_CHECKOUT_APP_PRIVATE_KEY_B64:-}" ] && have_tools; then
              key_file="$(mktemp)"
              trap 'rm -f "$key_file"' EXIT
              printf '%s' "$GITHUB_CHECKOUT_APP_PRIVATE_KEY_B64" | base64 -d > "$key_file"
              b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
              now=$(date +%s)
              header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
              payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$GITHUB_CHECKOUT_APP_ID" | b64url)
              signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)
              jwt="$header.$payload.$signature"
              installation_id=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
                -H "Authorization: Bearer $jwt" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${repo_path}/installation" | jq -r '.id') || installation_id=""
              if [ -n "$installation_id" ] && [ "$installation_id" != "null" ]; then
                token=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -X POST \
                  -H "Authorization: Bearer $jwt" \
                  -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  -d "{\"repositories\":[\"${CIRCLE_PROJECT_REPONAME}\"],\"permissions\":{\"contents\":\"read\"}}" \
                  "https://api.github.com/app/installations/${installation_id}/access_tokens" | jq -r '.token') || token=""
              fi
              if [ -n "$token" ] && [ "$token" != "null" ]; then
                basic=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
              else
                token=""
                echo "GitHub App token unavailable, checking out anonymously" >&2
              fi
            fi

            git_auth() {
              if [ -n "$token" ]; then
                GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${repo_url}.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}" git "$@"
              else
                git "$@"
              fi
            }

            fetch_repo() {
              if [ "$CHECKOUT_METHOD" = "blobless" ]; then
                git_auth fetch --filter=blob:none "$@"
              else
                git_auth fetch "$@"
              fi
            }

            if [ ! -e .git ]; then
              git init -q
            fi

            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$repo_url"
            else
              git remote add origin "$repo_url"
            fi

            if [ -n "$token" ]; then
              echo "Checking out with GitHub App token"
            else
              echo "Checking out anonymously"
            fi

            fetch_repo --quiet --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
            fetch_repo origin "$CIRCLE_SHA1"

            if [ -n "${CIRCLE_BRANCH:-}" ]; then
              git_auth checkout -q --force -B "$CIRCLE_BRANCH" "$CIRCLE_SHA1"
            else
              git_auth checkout -q --force "$CIRCLE_SHA1"
            fi

            if [ "$(git rev-parse HEAD)" != "$CIRCLE_SHA1" ]; then
              echo "HEAD $(git rev-parse HEAD) does not match CIRCLE_SHA1 ${CIRCLE_SHA1}" >&2
              exit 1
            fi

            if [ -n "${CIRCLE_TAG:-}" ]; then
              if ! git rev-parse -q --verify "refs/tags/${CIRCLE_TAG}" >/dev/null; then
                echo "Tag ${CIRCLE_TAG} not found" >&2
                exit 1
              fi
            fi

  setup-golangci:
    description: "Install golangci-lint"
    steps:
      - run:
          name: Install golangci-lint
          command: |
            export GOBIN=$(go env GOPATH)/bin
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
            echo "export PATH=$GOBIN:$PATH" >> "$BASH_ENV"
            source "$BASH_ENV"
            golangci-lint version

jobs:
  lint:
    executor: go-executor
    steps:
      - github-checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Download modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
            - ~/.cache/go-build
      - setup-golangci
      - run:
          name: Run golangci-lint
          command: golangci-lint run --timeout=5m

  test:
    executor: go-executor
    steps:
      - github-checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Download modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
            - ~/.cache/go-build
      - run:
          name: Install go-junit-report
          command: go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - run:
          name: Run tests with coverage and generate JUnit report
          command: |
            mkdir -p test-results
            go test -v -coverprofile=coverage.out ./... | tee test-results/go-test.out
            /home/circleci/go/bin/go-junit-report < test-results/go-test.out > test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: coverage.out

  build-site:
    executor: go-node-executor
    steps:
      - github-checkout
      # golangci-lint, `go build ./...` and `go vet ./...` all skip files behind `//go:build js &&
      # wasm`, so this is the only thing in CI that catches a broken wasm export.
      - run:
          name: Build wasm target
          command: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - run:
          name: Build site
          command: ./scripts/build-site.sh
      - run:
          name: Assert wasm matches Go hashing
          command: node scripts/wasm-parity-test.mjs
      - run:
          name: Test the page's pure functions
          command: node scripts/web-test.mjs
      - run:
          name: Assert published allowlist
          command: |
            for f in site/index.html site/app.css site/app.js site/verify.js \
                     site/wasm/main.wasm site/wasm/wasm_exec.js site/build-info.json; do
              if [ ! -f "$f" ]; then
                echo "missing expected file: $f"
                exit 1
              fi
            done
            for p in site/reader.html site/lib/qrscanner; do
              if [ -e "$p" ]; then
                echo "must not be published: $p"
                exit 1
              fi
            done
            find site -type f | sort

workflows:
  ci:
    jobs:
      - lint
      - test:
          requires:
            - lint
      - build-site
