version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.26.6
    resource_class: medium+
    environment:
      GOFLAGS: -mod=readonly
  # The plain cimg/go image ships no Node, which the page and wasm tests need.
  go-node-executor:
    docker:
      - image: cimg/go:1.26.6-node
    resource_class: medium+
    environment:
      GOFLAGS: -mod=readonly

commands:
  github-checkout:
    description: "Check out the repo over HTTPS, anonymously."
    parameters:
      method:
        description: "Clone method: full or blobless (blob:none filter)."
        type: enum
        enum: ["full", "blobless"]
        default: "full"
    steps:
      - run:
          name: Check out code
          environment:
            CHECKOUT_METHOD: << parameters.method >>
          command: |
            set -euo pipefail

            : "${CIRCLE_SHA1:?CIRCLE_SHA1 is not set}"

            repo_url="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"

            fetch_repo() {
              if [ "$CHECKOUT_METHOD" = "blobless" ]; then
                git fetch --filter=blob:none "$@"
              else
                git fetch "$@"
              fi
            }

            if [ ! -e .git ]; then
              git init -q
            fi

            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$repo_url"
            else
              git remote add origin "$repo_url"
            fi

            echo "Checking out anonymously"

            fetch_repo --quiet --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
            fetch_repo origin "$CIRCLE_SHA1"

            if [ -n "${CIRCLE_BRANCH:-}" ]; then
              git checkout -q --force -B "$CIRCLE_BRANCH" "$CIRCLE_SHA1"
            else
              git checkout -q --force "$CIRCLE_SHA1"
            fi

            if [ "$(git rev-parse HEAD)" != "$CIRCLE_SHA1" ]; then
              echo "HEAD $(git rev-parse HEAD) does not match CIRCLE_SHA1 ${CIRCLE_SHA1}" >&2
              exit 1
            fi

            if [ -n "${CIRCLE_TAG:-}" ]; then
              if ! git rev-parse -q --verify "refs/tags/${CIRCLE_TAG}" >/dev/null; then
                echo "Tag ${CIRCLE_TAG} not found" >&2
                exit 1
              fi
            fi

  setup-golangci:
    description: "Install golangci-lint"
    steps:
      - run:
          name: Install golangci-lint
          command: |
            export GOBIN=$(go env GOPATH)/bin
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
            echo "export PATH=$GOBIN:$PATH" >> "$BASH_ENV"
            source "$BASH_ENV"
            golangci-lint version

jobs:
  lint:
    executor: go-executor
    steps:
      - github-checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Download modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
            - ~/.cache/go-build
      - setup-golangci
      - run:
          name: Run golangci-lint
          command: golangci-lint run --timeout=5m

  test:
    executor: go-executor
    steps:
      - github-checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Download modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
            - ~/.cache/go-build
      - run:
          name: Install go-junit-report
          command: go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - run:
          name: Run tests with coverage and generate JUnit report
          command: |
            mkdir -p test-results
            go test -v -coverprofile=coverage.out ./... | tee test-results/go-test.out
            /home/circleci/go/bin/go-junit-report < test-results/go-test.out > test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: coverage.out

  build-site:
    executor: go-node-executor
    steps:
      - github-checkout
      # golangci-lint, `go build ./...` and `go vet ./...` all skip files behind `//go:build js &&
      # wasm`, so this is the only thing in CI that catches a broken wasm export.
      - run:
          name: Build wasm target
          command: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - run:
          name: Build site
          command: ./scripts/build-site.sh
      - run:
          name: Assert wasm matches Go hashing
          command: node scripts/wasm-parity-test.mjs
      - run:
          name: Test the page's pure functions
          command: node scripts/web-test.mjs
      - run:
          name: Assert published allowlist
          command: |
            for f in site/index.html site/app.css site/app.js site/verify.js \
                     site/wasm/main.wasm site/wasm/wasm_exec.js site/build-info.json; do
              if [ ! -f "$f" ]; then
                echo "missing expected file: $f"
                exit 1
              fi
            done
            for p in site/reader.html site/lib/qrscanner; do
              if [ -e "$p" ]; then
                echo "must not be published: $p"
                exit 1
              fi
            done
            find site -type f | sort

workflows:
  ci:
    jobs:
      - lint
      - test:
          requires:
            - lint
      - build-site
